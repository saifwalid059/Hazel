name: Hazel (Saif) release

# Builds a signed release APK of the fork on every push to `images`.
# The keystore never lives in the repository: it comes from four repository secrets
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD), the same ones the
# upstream release.yml reads, and is written to the runner's temp folder only.

on:
  push:
    branches: [images]
  workflow_dispatch:

concurrency:
  group: saif-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # gallery-dl plus requests and friends, as one zipapp the app's own Python runs.
      - name: Build the gallery-dl zipapp
        run: PYTHON=python bash tools/saif/build_gallery_dl.sh

      - name: Check the zipapp runs
        run: python -I app/src/main/assets/gallery-dl.pyz --version

      - name: Restore the signing keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing keystore is configured. Set the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD repository secrets."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/hazel.jks"
          cat > "$RUNNER_TEMP/signing/signing.properties" <<PROPS
          storeFile=hazel.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "HAZEL_SIGNING_DIR=$RUNNER_TEMP/signing" >> "$GITHUB_ENV"

      # The GitHub flavour only, one APK per architecture plus a universal one.
      - name: Build
        run: ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Collect the APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          rm -rf "$RUNNER_TEMP/signing"
          ls -l artifacts
          {
            echo "## Hazel (Saif) ${GITHUB_SHA::7}"
            for apk in artifacts/*.apk; do echo "- \`$(basename "$apk")\` ($(du -h "$apk" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Hazel-Saif-release
          path: artifacts/*.apk
          if-no-files-found: error
